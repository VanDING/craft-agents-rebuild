appId: com.lukilabs.craft-agent
productName: Craft Agents
copyright: Copyright © 2026 Craft Docs Ltd.

artifactName: Craft-Agents-${arch}.${ext}

electronVersion: "43.1.1"

# Hook to compile macOS 26+ Liquid Glass icon after packaging
afterPack: scripts/afterPack.cjs

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - "!dist/renderer/src/**"
  - "!**/*.map"
  - package.json
  # Include bundled bridge MCP server for Codex sessions
  - resources/bridge-mcp-server/**/*
  # Include Pi agent server subprocess for Pi SDK sessions
  - resources/pi-agent-server/**/*
  # Note: Bundled assets (docs, themes, permissions, tool-icons) are in resources/
  # and copied to dist/resources/ by build:copy. They're included via dist/**/* above.
  # Include network interceptor for API error capture and MCP schema injection
  - packages/shared/src/unified-network-interceptor.ts
  - packages/shared/src/interceptor-common.ts
  - packages/shared/src/feature-flags.ts
  - packages/shared/src/interceptor-request-utils.ts
  # CLI tools (wrappers, python scripts, platform uv binary) ship via
  # extraResources below — they must live OUTSIDE app.asar because child
  # processes (cmd/bash/uv) cannot execute files inside asar.
  # Include bundled Bun runtime (platform-specific, set by build script)
  - vendor/bun/**/*
  # Exclude everything from node_modules (will use extraResources for SDK)
  - "!node_modules/**/*"

# Disable ASAR to avoid decompression overhead and click delays (matches
# upstream). Regression note: this line was dropped during the 2026-07 Pi SDK
# migration, silently re-enabling asar and trapping resources/bin +
# resources/scripts inside app.asar — CLI document tools became unexecutable
# in packaged builds. bin/scripts also ship via extraResources below as a
# second line of defense.
asar: false


extraResources:
  # Native PTY runtime for the local integrated terminal. Hoisted to the
  # workspace root by bun, so the source is repo-root-relative.
  - from: ../../node_modules/node-pty
    to: app/node_modules/node-pty
  # Pi agent server subprocess (Pi SDK sessions)
  - from: dist/resources/pi-agent-server
    to: pi-agent-server
  # ripgrep (used by search service)
  - from: node_modules/@vscode/ripgrep
    to: app/node_modules/@vscode/ripgrep
  # ripgrep platform package: @vscode/ripgrep >= 1.15 resolves the binary via
  # its optionalDependency @vscode/ripgrep-<platform>-<arch> (lib/index.js), so
  # the platform package must ship next to it.
  - from: node_modules/@vscode/ripgrep-darwin-${arch}
    to: app/node_modules/@vscode/ripgrep-darwin-${arch}
  # Windows optional package. The wrapper above contains no binary and resolves
  # rg.exe from this sibling package at runtime.
  - from: node_modules/@vscode/ripgrep-win32-${arch}
    to: app/node_modules/@vscode/ripgrep-win32-${arch}
  # WhatsApp worker subprocess (self-contained; Baileys bundled in).
  # Runtime resolves it at <resourcesPath>/messaging-whatsapp-worker/worker.cjs
  # (apps/electron/src/main/index.ts), so stage it flat under Resources — the
  # old `to: app/packages/...` placement never matched that path and every
  # packaged WhatsApp connect died with MODULE_NOT_FOUND.
  # NB: extraResources `from` is relative to the project dir (apps/electron),
  # so the worker package at the repo root needs the ../.. prefix.
  - from: ../../packages/messaging-whatsapp-worker/dist
    to: messaging-whatsapp-worker
    filter:
      - "**/*"
  # CLI document tools: wrappers (pdf-tool, xlsx-tool, …) + .cmd launchers +
  # python scripts + platform uv binary. Staged under <resources>/app so the
  # main-process resourcesBase (process.resourcesPath/app) resolves binDir,
  # scriptsDir and the uv binary to real disk paths — asar-virtual paths are
  # invisible to spawned cmd/bash/uv processes (ENOENT / not recognized).
  - from: resources/bin
    to: app/resources/bin
    filter:
      - "**/*"
  - from: resources/scripts
    to: app/resources/scripts
    filter:
      - "**/*"
  # Bun runtime
  - from: vendor/bun
    to: app/vendor/bun
    filter:
      - "**/*"
  # Bridge MCP server
  - from: dist/resources/bridge-mcp-server
    to: resources/bridge-mcp-server
