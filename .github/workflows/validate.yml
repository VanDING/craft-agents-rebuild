name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Reject Windows-illegal filenames
        run: |
          BAD=$(git ls-files | grep -E '[<>:"|?*]' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Files with characters illegal on Windows:"
            echo "$BAD"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run validation suite
        run: bun run validate:ci

  quality-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type checks
        run: bun run typecheck:all

      - name: Lint
        run: bun run lint

      - name: i18n checks
        run: |
          bun run lint:i18n:parity
          bun run lint:i18n:sorted
          bun run lint:i18n:coverage

      # Regression coverage for Windows path/permission behavior. Each command
      # runs in its own Bun process so mock.module() cannot leak between files.
      - name: Cross-platform regression tests
        run: |
          bun test ./apps/electron/eslint-rules/__tests__
          bun test ./apps/electron/src/shared/__tests__/ipc-channels.test.ts
          bun test ./packages/ui/eslint-rules/__tests__
          bun test ./packages/messaging-gateway/src/__tests__/wechat-send.isolated.ts
          bun test ./packages/messaging-gateway/src/__tests__/wechat-url.isolated.ts
          bun test ./packages/shared/src/config/__tests__/theme.test.ts
          bun test ./packages/shared/src/sessions/__tests__/persistence-queue.test.ts
